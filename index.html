<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artsphere - Art Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #eee9ff;
            color: #292344;
        }

        h1 {
            text-align: center;
            color: #6941a5;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #493477;
        }

        hr {
            border: 1px solid #c8b8eb;
        }

        .music-section {
            text-align: center;
            margin: 25px auto;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 12px;
            max-width: 600px;
        }

        .music-section audio {
            margin-top: 10px;
            width: 100%;
        }

        .youtube-section {
            width: 100%;
            margin: 35px auto;
            text-align: center;
        }

        .youtube-section h2 {
            margin-bottom: 20px;
        }

        .youtube-thumbnail {
            position: relative;
            display: block;
            width: 100%;
            height: 450px;
            overflow: hidden;
            border-radius: 15px;
            text-decoration: none;
            background-color: #d4c5f0;
        }

        .youtube-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(25, 15, 45, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .youtube-thumbnail:hover .video-overlay {
            background: rgba(25, 15, 45, 0.55);
        }

        .click-text {
            color: white;
            font-size: 28px;
            font-weight: bold;
            padding: 18px 30px;
            border: 2px solid white;
            border-radius: 10px;
            background: rgba(105, 65, 165, 0.8);
        }

        .content-section {
            text-align: center;
            margin: 35px auto;
            padding: 20px;
            background-color: white;
            border-radius: 12px;
        }

        iframe {
            width: 90%;
            max-width: 800px;
            height: 450px;
            border: none;
            border-radius: 10px;
        }

        embed {
            width: 90%;
            height: 500px;
            border-radius: 10px;
        }

        #art {
            width: 100%;
            height: 600px;
            object-fit: contain;
            margin-top: 20px;
            background-color: #ffffff;
            border-radius: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 32px;
            }

            .youtube-thumbnail {
                height: 250px;
            }

            .click-text {
                font-size: 19px;
                padding: 12px 18px;
            }

            iframe {
                height: 300px;
            }

            #art {
                height: 300px;
            }
        }
    </style>
</head>

<body>

    <!-- Website Heading -->
    <header>
        <h1>ARTSPHERE</h1>
        <hr>
        <h2>Welcome to Our Art Gallery</h2>
        <hr>
    </header>

    <!-- Music Player -->
    <section class="music-section">
        <h2>🎵 Enjoy Some Music</h2>
        <p>Relax and enjoy the music while exploring our gallery.</p>

        <audio controls>
            <source src="East_Duo_-_Chubina_(mp3.pm).mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </section>

    <!-- Full Width YouTube Thumbnail -->
    <section class="youtube-section">
        <h2>Explore Our Art Gallery</h2>

        <a href="https://www.youtube.com/embed/D52YCwKeu6s" target="_blank"
           rel="noopener noreferrer"
           class="youtube-thumbnail">

            <img src="art.jpeg" alt="Art Gallery Video">

            <div class="video-overlay">
                <span class="click-text">
                    ▶ CLICK TO WATCH VIDEO
                </span>
            </div>

        </a>
    </section>

    <!-- Google Map -->
    <section class="content-section">
        <h2>📍 View Our Map</h2>

        <iframe
            src="https://www.google.com/maps?q=National+Gallery+of+Modern+Art+New+Delhi&output=embed"
            loading="lazy"
            allowfullscreen>
        </iframe>

        <p>View the location on the map above.</p>
    </section>

    <!-- PDF Viewer -->
    <section class="content-section">
        <h2>📄 Art Gallery PDF</h2>

        <embed src="art1.pdf" type="application/pdf">

    </section>

    <!-- Local Video -->
    <section class="content-section">
        <h2>🎬 Art Gallery Video</h2>

        <video id="art" controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video element.
        </video>
    </section>

</body>
</html>
